services:
  - type: web
    name: monkey-mania-2
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DRAIN_MS
        value: '25000' # Render waits about 30 s after SIGTERM
      - key: TRUST_PROXY
        value: '1' # client IP comes from Render's X-Forwarded-For, for the per-IP limit
