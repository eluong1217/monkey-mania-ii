<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkey Mania II</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          20px/1.4 system-ui,
          sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
      }
      .screen {
        width: min(480px, 92vw);
      }
      .screen h1 {
        text-align: center;
      }
      .screen label {
        display: block;
        margin-top: 12px;
      }
      .screen input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 8px;
        text-transform: none;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
        background: #ffd23f;
        border: 3px solid #5a3b00;
        border-radius: 6px;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 4px solid #fff;
        outline-offset: 2px;
        box-shadow: 0 0 0 7px #e8590c;
      }
      .seats {
        list-style: none;
        padding: 0;
      }
      .seats li {
        padding: 6px 10px;
        margin: 4px 0;
        background: rgba(255, 255, 255, 0.15);
      }
      .seats li.ready {
        background: rgba(60, 200, 90, 0.4);
      }
      .error {
        color: #ffb3a7;
        min-height: 1.4em;
      }
      [hidden] {
        display: none !important;
      }
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 8px;
        font: 12px/1.3 monospace;
        color: #0f0;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
